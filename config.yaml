# Configuration for AMD RNA-Seq Denoising Autoencoder Project

# --- Datasets ---
# List datasets to process
datasets:
  gse115828:
    counts_file: "GSE115828_raw_counts_GRCh38.p13_NCBI.tsv"
    metadata_file: "GSE115828_metadata.csv"
    mapping_file: "GSE115828_sample_mapping.csv"
    annotation_file: "Human.GRCh38.p13.annot.tsv"
  
# --- Preprocessing Parameters ---
preprocessing:
  min_counts_per_gene: 10 # Minimum count threshold for genes
  min_samples_per_gene_pct: 0.1 # Minimum percentage of samples a gene must be present in
  rin_threshold: 6.0 # Minimum RIN score for samples
  metadata_cols:
    - "age"
    - "sex"
    - "mgs_level"
    - "postmortem_interval_hrs"
    - "rin"
    - "lib_prep_batch"
    - "library_prepper"
  split_ratios: # Train, Validation, Test. TODO: Adjust based on final model architecture
    train: 0.70
    validation: 0.15
    test: 0.15
  stratify_on: "mgs_level" 
  covariates: 
    - "age"
    - "sex"
    - "rin"
    - "postmortem_interval_hrs"

# --- Model Architecture (Example for NB-AE - Add VAE section later) ---
model_ae:
  type: "NB_AE" # Or ZINB_AE
  distribution: "NB" # 'NB' or 'ZINB'
  encoder_layers: [512, 128]
  bottleneck_size: 64
  decoder_layers: [128, 512]
  activation: "relu"

# --- Model Architecture (Placeholder for VAE) ---
# model_vae:
#   type: "NB_VAE" # Or ZINB_VAE, Gaussian_VAE
#   distribution: "NB"
#   encoder_layers: [512, 128]
#   latent_dim: 32 # VAE specific
#   decoder_layers: [128, 512]
#   activation: "relu"
#   kl_weight: 1.0 # VAE specific

# --- Training Hyperparameters (Common - Add VAE specific later if needed) ---
training:
  # input_scaling: "none" # Removed - log1p is now standard prep for X
  learning_rate: 0.0001
  batch_size: 64
  epochs: 200
  early_stopping_patience: 15
  optimizer: "adamw" # AdamW often preferred
  dropout_rate: 0.1

# --- Baseline Model Parameters (Optional - can be hardcoded or set here) ---
# baseline_knn:
#   n_neighbors: 5
#   pca_components: 50
# baseline_rf:
#   n_estimators: 100
#   max_depth: null

# --- DGE Analysis ---
dge:
  contrast_variable: "mgs_level"
  contrast_level_1: "4" # Numerator (e.g., Diseased)
  contrast_level_2: "1" # Denominator (e.g., Control)
  padj_threshold: 0.05

# --- Evaluation ---
evaluation:
  plot_formats: ["png", "svg"]
  umap_components: 2
  pca_components: 2

# --- Environment ---
random_seed: 42

