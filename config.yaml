# Configuration for AMD RNA-Seq Denoising Autoencoder Project

# --- Datasets ---
# List datasets to process
datasets:
  gse115828:
    counts_file: "GSE115828_raw_counts_GRCh38.p13_NCBI.tsv"
    metadata_file: "GSE115828_metadata.csv"
    mapping_file: "GSE115828_sample_mapping.csv"
    annotation_file: "Human.GRCh38.p13.annot.tsv"
  
# --- Preprocessing Parameters ---
preprocessing:
  min_counts_per_gene: 10 # Minimum count threshold for genes
  min_samples_per_gene_pct: 0.1 # Minimum percentage of samples a gene must be present in
  rin_threshold: 6.0 # Minimum RIN score for samples
  metadata_cols:
    - "age"
    - "sex"
    - "mgs_level"
    - "postmortem_interval_hrs"
    - "rin"
    - "lib_prep_batch"
    - "library_prepper"
  split_ratios: # Train, Validation, Test. TODO: Adjust based on final model architecture
    train: 0.80
    validation: 0.10
    test: 0.10
  stratify_on: "mgs_level" 
  covariates: 
    - "age"
    - "sex"
    - "rin"
    - "postmortem_interval_hrs"
    - "lib_prep_batch"
    - "library_prepper"

# --- Model Architecture (Example for NB-AE - Add VAE section later) ---
model_ae:
  type: "NB_AE" # Or ZINB_AE
  distribution: "NB" # 'NB' or 'ZINB'
  encoder_layers: [512, 128]
  bottleneck_size: 128
  decoder_layers: [64, 256, 512]
  activation: "relu"

# --- Model Architecture (Placeholder for VAE) ---
model_vae:
  type: "NB_VAE" # Or ZINB_VAE, Gaussian_VAE
  distribution: "NB"
  encoder_layers: [512, 128]
  latent_dim: 16 # VAE specific
  decoder_layers: [128, 256, 512]
  activation: "relu"
  kl_weight: 0.1 # VAE specific

# --- Training Hyperparameters (Common - Add VAE specific later if needed) ---
# --- Training Hyperparameters (Common - Add VAE specific later if needed) ---
training:
  # input_scaling: "none" # Removed - log1p is now standard prep for X
  learning_rate: 8.929725213875575e-05
  batch_size: 64
  epochs: 200
  early_stopping_patience: 20
  optimizer: "adamw" # AdamW often preferred
  dropout_rate: 0.05
  
hyperparam_search:
  baseline_knn:
    n_neighbors: [3, 5, 10, 15, 20]
    pca_components: [10, 20, 50, 100]
    n_iter: 20
  baseline_rf:
    n_estimators: [100, 200, 500, 1000]
    max_depth: [5, 10, 20, null]
    max_features: ['sqrt', 'log2', 0.5]
    n_iter: 20
  ae:
    n_trials: 50
    param_distributions:
      learning_rate: [1e-5, 1e-4, 1e-3]
      batch_size: [32, 64, 128]
      dropout_rate: [0.05, 0.1, 0.2, 0.3]
      encoder_layers:
        - [512, 128]
        - [256, 64]
        - [512, 256, 64]
      bottleneck_size: [32, 64, 128]
      decoder_layers:
        - [128, 512]
        - [64, 256, 512]
        - [128, 256, 128]
  vae:
    n_trials: 50
    param_distributions:
      learning_rate: [1e-5, 5e-5, 1e-4]
      batch_size: [32, 64]
      dropout_rate: [0.05, 0.1, 0.2, 0.3]
      encoder_layers:
        - [512, 128]
        - [256, 128]
      latent_dim: [16, 32, 64]
      decoder_layers:
        - [128, 256]
        - [128, 256, 512]
      kl_weight: [0.1, 0.5, 1.0]
        
# --- Baseline Model Parameters (Optional - can be hardcoded or set here) ---
baseline_knn:
  n_neighbors: 5
  pca_components: 50
baseline_rf:
  n_estimators: 100
  max_depth: 10    # or null
  n_jobs: -1       # use -1 to auto‐detect all cores
# --- DGE Analysis ---
dge:
  contrast_variable: "mgs_level"
  contrast_level_1: "4" # Numerator (e.g., Diseased)
  contrast_level_2: "1" # Denominator (e.g., Control)
  padj_threshold: 0.05

# --- Evaluation ---
evaluation:
  plot_formats: ["png", "svg"]
  umap_components: 2
  pca_components: 2

# --- Environment ---
random_seed: 42